<!-- ================= BANNER ================= -->
<div class="banner-container">
  <img
    *ngIf="bannerUrl; else defaultBanner"
    [src]="bannerUrl"
    alt="Main banner"
    class="banner1"
    width="1920"
    height="700"
    fetchpriority="high"
    decoding="async"
  />

  <ng-template #defaultBanner>
    <img
      src="assets/default-banner.jpg"
      alt="Default banner"
      class="banner1"
      width="1920"
      height="700"
      decoding="async"
    />
  </ng-template>

  <button class="btn" routerLink="/products">
    {{ lang.t('bannerBtn') }}
  </button>
</div>

<!-- ================= PRODUCT GRID ================= -->
<div class="product-grid">

  <!-- BIG LEFT IMAGE -->
  <div class="item i8">
    <img
      [src]="grid1 || 'assets/placeholder.jpg'"
      alt="Featured product"
      width="600"
      height="600"
      loading="lazy"
      decoding="async"
    />
  </div>

  <!-- SMALL GRID ITEMS -->
  <div class="item">
    <img [src]="grid2 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid3 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid4 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid5 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid6 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid7 || 'assets/placeholder.jpg'" width="400" height="400" loading="lazy" />
  </div>
</div>

<!-- ================= ABOUT SECTION ================= -->
<section class="about-section">
  <h2 class="about-title">
    {{ lang.t('aboutTitle') }}
  </h2>

  <p class="about-text">
    {{ lang.t('aboutText') }}
  </p>

  <button class="about-btn" routerLink="/products">
    {{ lang.t('aboutBtn') }}
  </button>
</section>
