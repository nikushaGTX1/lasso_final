<!-- ================= BANNER ================= -->
<div class="banner-container">

  <img
    *ngIf="bannerUrl; else defaultBanner"
    [src]="bannerUrl"
    alt="Main banner"
    class="banner1"
    loading="eager"
    fetchpriority="high"
  />

  <ng-template #defaultBanner>
    <img
      src="assets/default-banner.jpg"
      alt="Main banner"
      class="banner1"
      loading="eager"
      fetchpriority="high"
    />
  </ng-template>

  <button class="btn" routerLink="/products">
    {{ lang.t('bannerBtn') }}
  </button>

</div>

<!-- ================= PRODUCT GRID ================= -->
<div class="product-grid">

  <!-- BIG LEFT IMAGE -->
  <div class="item i8">
    <img
      [src]="grid1 || 'assets/placeholder.jpg'"
      alt="Featured product"
      loading="lazy"
    />
  </div>

  <!-- OTHER 6 IMAGES -->
  <div class="item">
    <img [src]="grid2 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid3 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid4 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid5 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid6 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

  <div class="item">
    <img [src]="grid7 || 'assets/placeholder.jpg'" alt="Product image" loading="lazy" />
  </div>

</div>

<!-- ================= ABOUT SECTION ================= -->
<section class="about-section">

  <h2 class="about-title">
    {{ lang.t('aboutTitle') }}
  </h2>

  <p class="about-text">
    {{ lang.t('aboutText') }}
  </p>

  <button class="about-btn" routerLink="/products">
    {{ lang.t('aboutBtn') }}
  </button>

</section>
